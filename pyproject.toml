[project]
name = "skypulse-data-platform"
version = "1.0.0"
description = "Cloud-native Weather & Air Quality ELT Data Engineering Platform using Apache Airflow, dbt, DuckDB/PostgreSQL, FastAPI, and GitHub Actions (No AWS)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
