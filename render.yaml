databases:
  - name: skypulse-db
    databaseName: skypulse
    user: skypulse_user
    plan: free

services:
  - type: web
    name: skypulse-data-platform
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WAREHOUSE_BACKEND
        value: postgres
      - key: AUTO_BOOTSTRAP_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: skypulse-db
          property: connectionString
