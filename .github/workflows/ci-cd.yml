name: SkyPulse CI/CD & Scheduled ELT

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Automated ELT refresh every 6 hours against cloud PostgreSQL (when DATABASE_URL secret is set)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ci-test-and-dbt:
    name: Lint, Unit/E2E Tests & dbt Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src tests scripts

      - name: Run unit and E2E tests (DuckDB + FastAPI)
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t skypulse-data-platform:ci .

  cd-elt-and-deploy:
    name: Cloud ELT Refresh & PaaS Deployment
    needs: ci-test-and-dbt
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run ELT + dbt build against Cloud PostgreSQL (Neon / Render)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          ENVIRONMENT: production
          WAREHOUSE_BACKEND: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.ingestion.run_pipeline

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' && github.event_name == 'push' }}
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
